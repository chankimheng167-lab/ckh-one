name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ckh/shared build
      - name: Unit tests (shared domain logic)
        run: pnpm --filter @ckh/shared test
      - name: Type-check API
        run: pnpm --filter @ckh/api typecheck
      - name: Database guard checks (RLS, oversell, ledger balance, audit log)
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE ckh_guards"
          for f in apps/api/db/migrations/*.sql apps/api/db/repeatable/*.sql; do
            psql -h localhost -U postgres -d ckh_guards -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done
          psql -h localhost -U postgres -d ckh_guards -f apps/api/db/tests/schema_guards.sql 2>&1 | tee guards.log
          for expected in "violates row-level security policy for table \"customers\"" \
                          "permission denied for table platform_modules" \
                          "violates row-level security policy for table \"tenant_modules\"" \
                          "products_tenant_id_base_unit_id_fkey" \
                          "would exceed stock on hand" \
                          "does not balance" \
                          "permission denied for table audit_log"; do
            grep -q "$expected" guards.log || { echo "MISSING EXPECTED GUARD: $expected"; exit 1; }
          done
      - name: API end-to-end tests
        run: pnpm --filter @ckh/api test
      - name: Lint, type-check and build the web app
        run: |
          pnpm --filter @ckh/web lint
          pnpm --filter @ckh/web typecheck
          pnpm --filter @ckh/web build
      - name: Desktop app unit tests (ESC/POS, encrypted store, security rules)
        run: |
          pnpm --filter @ckh/desktop typecheck
          pnpm --filter @ckh/desktop test

  desktop-e2e:
    # Drives the real Electron app against a real API and database: sign-in,
    # silent printing (to PDF), ESC/POS over TCP, and offline selling with the
    # API stopped and restarted. Linux under a virtual display.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ckh_e2e
      DATABASE_URL: postgres://ckh_app_user:e2e-only-password@localhost:5432/ckh_e2e
      JWT_SECRET: e2e-only-secret-e2e-only-secret-0123456789
      CORS_ORIGINS: app://ckh
      PORT: "3001"
      CKH_API_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ckh/shared build
      - name: Database with the demo company
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE ckh_e2e"
          pnpm db:migrate
          pnpm db:seed
          psql -h localhost -U postgres -d ckh_e2e -c "CREATE ROLE ckh_app_user LOGIN PASSWORD 'e2e-only-password' IN ROLE ckh_app"
      - name: Build API, web bundle and desktop app
        run: |
          pnpm --filter @ckh/api build
          NEXT_PUBLIC_API_URL=$CKH_API_URL pnpm --filter @ckh/web build
          pnpm --filter @ckh/desktop build
      - name: Electron end-to-end (sales, printing, offline selling)
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          # A throwaway licence key for this run only.
          export POS_LICENSE_PRIVATE_KEY=$(node -e "const k=require('crypto').generateKeyPairSync('ed25519');console.log(Buffer.from(k.privateKey.export({type:'pkcs8',format:'pem'})).toString('base64'))")
          bash apps/desktop/e2e/api.sh start
          cd apps/desktop
          CKH_E2E_API_STOP="bash e2e/api.sh stop" CKH_E2E_API_START="bash e2e/api.sh start" xvfb-run -a node e2e/run.js
      - if: failure()
        run: tail -100 /tmp/ckh-e2e-api.log || true

  windows-installer:
    # Builds the unsigned Windows installer to prove packaging works. Release
    # builds must be signed (see apps/desktop/electron-builder.config.js).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ckh/shared build
      - name: Build the web app for the desktop bundle
        shell: pwsh
        run: |
          $env:NEXT_PUBLIC_API_URL = "https://api.example.com/api/v1"
          pnpm --filter @ckh/web build
      - name: Build the installer (unsigned)
        shell: pwsh
        run: |
          $env:NEXT_PUBLIC_API_URL = "https://api.example.com/api/v1"
          pnpm --filter @ckh/desktop dist:win
          Get-ChildItem apps/desktop/release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ckh-one-pos-installer-unsigned
          path: apps/desktop/release/*.exe
          retention-days: 7
