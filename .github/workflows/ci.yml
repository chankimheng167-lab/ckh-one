name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ckh/shared build
      - name: Unit tests (shared domain logic)
        run: pnpm --filter @ckh/shared test
      - name: Type-check API
        run: pnpm --filter @ckh/api typecheck
      - name: Database guard checks (RLS, oversell, ledger balance, audit log)
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE ckh_guards"
          for f in apps/api/db/migrations/*.sql apps/api/db/repeatable/*.sql; do
            psql -h localhost -U postgres -d ckh_guards -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done
          psql -h localhost -U postgres -d ckh_guards -f apps/api/db/tests/schema_guards.sql 2>&1 | tee guards.log
          for expected in "violates row-level security policy for table \"customers\"" \
                          "permission denied for table platform_modules" \
                          "violates row-level security policy for table \"tenant_modules\"" \
                          "products_tenant_id_base_unit_id_fkey" \
                          "would exceed stock on hand" \
                          "does not balance" \
                          "permission denied for table audit_log"; do
            grep -q "$expected" guards.log || { echo "MISSING EXPECTED GUARD: $expected"; exit 1; }
          done
      - name: API end-to-end tests
        run: pnpm --filter @ckh/api test
      - name: Type-check and build the web app
        run: |
          pnpm --filter @ckh/web typecheck
          pnpm --filter @ckh/web build
      - name: Desktop app unit tests (ESC/POS, encrypted store, security rules)
        run: |
          pnpm --filter @ckh/desktop typecheck
          pnpm --filter @ckh/desktop test

  windows-installer:
    # Builds the unsigned Windows installer to prove packaging works. Release
    # builds must be signed (see apps/desktop/electron-builder.config.js).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ckh/shared build
      - name: Build the web app for the desktop bundle
        shell: pwsh
        run: |
          $env:NEXT_PUBLIC_API_URL = "https://api.example.com/api/v1"
          pnpm --filter @ckh/web build
      - name: Build the installer (unsigned)
        shell: pwsh
        run: |
          $env:NEXT_PUBLIC_API_URL = "https://api.example.com/api/v1"
          pnpm --filter @ckh/desktop dist:win
          Get-ChildItem apps/desktop/release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ckh-one-pos-installer-unsigned
          path: apps/desktop/release/*.exe
          retention-days: 7
